name: Auto Release APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apks/*.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessario per la gestione e il push dei tag Git

      - name: Configura JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Rendi eseguibile gradlew
        run: chmod +x gradlew

      - name: Estrai versione e versionCode da Gradle
        id: parse_gradle
        run: |
          # Interroga direttamente Gradle per ottenere i valori esatti da build.gradle.kts
          VERSION_NAME=$(./gradlew -q printVersionName)
          VERSION_CODE=$(./gradlew -q printVersionCode)

          TAG_NAME="v$VERSION_NAME"

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Trova e verifica l'APK
        id: parse_apk
        run: |
          APK_FILE=$(ls apks/*.apk | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERRORE: Nessun APK trovato nella cartella apks/"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_FILE")
          MIN_SIZE=2097152

          if [ "$FILE_SIZE" -lt "$MIN_SIZE" ]; then
            echo "ERRORE: L'APK trovato pesa meno di 2MB!"
            exit 1
          fi

          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Crea e Push del Tag Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Crea il tag se non esiste già
          if ! git rev-parse ${{ steps.parse_gradle.outputs.tag_name }} >/dev/null 2>&1; then
            git tag ${{ steps.parse_gradle.outputs.tag_name }}
            git push origin ${{ steps.parse_gradle.outputs.tag_name }}
          fi

      - name: Prepara le Note di Rilascio (Release Body)
        id: release_body
        run: |
          BODY=$(cat <<EOF
          versionCode=${{ steps.parse_gradle.outputs.version_code }}

          ## Note di rilascio
          - Nuovo aggiornamento automatico per la versione ${{ steps.parse_gradle.outputs.version_name }}.
          EOF
          )

          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF_MARKER" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "$EOF_MARKER" >> $GITHUB_OUTPUT

      - name: Crea una Nuova Release su GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse_gradle.outputs.tag_name }}
          name: "Release ${{ steps.parse_gradle.outputs.tag_name }}"
          body: ${{ steps.release_body.outputs.body }}
          files: ${{ steps.parse_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}